<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Management System - Smart Healthcare Platform</title>
  <meta name="description" content="Smart Healthcare Administration & Patient Management Platform with comprehensive role-based clinical, inpatient, pharmacy, billing, and lab operations." />
  <meta property="og:title" content="Hospital Management System - Smart Healthcare Platform" />
  <meta property="og:description" content="Smart Healthcare Administration & Patient Management Platform with comprehensive role-based clinical, inpatient, pharmacy, billing, and lab operations." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6.5.1 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Chart.js 4.4.1 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- ======================================================================
       1. AUTHENTICATION / LOGIN SECTION
       ====================================================================== -->
  <section id="auth-section" class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <i class="fa-solid fa-hospital-user"></i>
        </div>
        <h1>Hospital Management System</h1>
        <p>Smart Healthcare Administration & Patient Management Platform</p>
      </div>

      <!-- Quick Demo Credentials Box for Academic Evaluation -->
      <div class="demo-credentials-box">
        <div class="title">
          <i class="fa-solid fa-key"></i> Quick Demo Logins (Click to Fill)
        </div>
        <div class="demo-role-buttons">
          <button type="button" class="demo-role-btn" onclick="fillDemoCredentials('admin')">
            <i class="fa-solid fa-user-shield"></i> Admin
          </button>
          <button type="button" class="demo-role-btn" onclick="fillDemoCredentials('doctor')">
            <i class="fa-solid fa-user-doctor"></i> Doctor
          </button>
          <button type="button" class="demo-role-btn" onclick="fillDemoCredentials('receptionist')">
            <i class="fa-solid fa-headset"></i> Receptionist
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address <span class="required">*</span></label>
          <div class="search-box">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="login-email" required placeholder="e.g. admin@hms.com" autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="login-password">Password <span class="required">*</span></label>
          <div style="position: relative;">
            <input type="password" id="login-password" required placeholder="••••••••" class="form-control" autocomplete="current-password" />
            <button type="button" id="btn-toggle-pwd" class="btn-icon-subtle" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%);" title="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 0.8rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" id="login-remember" checked />
            Remember Me
          </label>
          <a href="#" onclick="showToast('Password reset link simulated. Please use demo credentials.', 'info'); return false;" style="color: var(--primary); font-weight: 500;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Portal
        </button>
      </form>
    </div>
  </section>

  <!-- ======================================================================
       2. MAIN APPLICATION CONTAINER (SIDEBAR + TOPBAR + CONTENT)
       ====================================================================== -->
  <div id="app-section" class="app-container" style="display: none;">
    
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <div class="sidebar-brand-icon">
            <i class="fa-solid fa-heart-pulse"></i>
          </div>
          <div class="sidebar-brand-text">
            <h2>CarePulse HMS</h2>
            <span id="sidebar-role-badge">Admin Suite</span>
          </div>
        </div>
        <button class="btn-icon-subtle" id="btn-close-sidebar-mobile" style="display: none;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-navigation">
        <!-- Rendered dynamically according to logged-in user role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-avatar-sm" id="sidebar-user-avatar">AD</div>
        <div class="user-info-text">
          <div class="name" id="sidebar-user-name">Administrator</div>
          <div class="role" id="sidebar-user-role">Super Admin</div>
        </div>
        <button class="btn-icon-subtle" onclick="promptLogout()" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <main class="app-main">
      
      <!-- Top Navigation Bar -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="breadcrumb-trail">
            <span>CarePulse</span>
            <i class="fa-solid fa-chevron-right" style="font-size: 0.7rem;"></i>
            <span class="active" id="topbar-breadcrumb">Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Theme Toggle -->
          <button class="btn btn-outline btn-icon" id="btn-theme-toggle" title="Toggle Light / Dark Mode">
            <i class="fa-regular fa-moon" id="theme-toggle-icon"></i>
          </button>

          <!-- Notifications Bell -->
          <div class="notification-bell-wrapper">
            <button class="btn btn-outline btn-icon" id="btn-bell" title="Notifications">
              <i class="fa-regular fa-bell"></i>
              <span class="bell-badge" id="unread-notif-count">0</span>
            </button>

            <!-- Notifications Dropdown -->
            <div class="notification-dropdown" id="notification-dropdown">
              <div class="notif-header">
                <h4>System Notifications</h4>
                <button type="button" onclick="markAllNotificationsAsRead()">Mark all as read</button>
              </div>
              <div class="notif-list" id="notifications-container">
                <!-- Notifications loaded dynamically -->
              </div>
            </div>
          </div>

          <!-- Quick Hospital Status / Current Time -->
          <div style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); padding: 0.35rem 0.65rem; background: var(--bg-surface-alt); border-radius: var(--radius-sm);" class="tabular-nums" id="live-clock">
            12:00:00 PM
          </div>

          <!-- Quick User Avatar & Logout -->
          <button class="btn btn-danger btn-sm" onclick="promptLogout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
          </button>
        </div>
      </header>

      <!-- Views Viewport -->
      <section class="app-content" id="main-viewport">
        <!-- Module Views are injected and toggled dynamically in script.js -->
      </section>

    </main>
  </div>

  <!-- ======================================================================
       3. MODAL CONTAINERS (SINGLETON CONTAINER FOR DIALOGS)
       ====================================================================== -->
  <div id="modal-container"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Main JavaScript File -->
  <script type="module" src="/script.js"></script>
</body>
</html>
